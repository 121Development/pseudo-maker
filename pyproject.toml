[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutable-cosmos"
version = "0.1.0"
description = "Anonymize Swedish PII in Word documents for safe LLM use, then restore."
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.0",
  "spacy>=3.7,<4.0",
  "Faker>=24.0",
  "python-stdnum>=1.20",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.5",
]

[project.scripts]
mutable-cosmos = "mutable_cosmos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mutable_cosmos.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
